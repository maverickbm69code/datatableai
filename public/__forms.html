<!DOCTYPE html>
<html lang="fr">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Netlify Forms detects this static copy of the lead form rendered by React. -->
    <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="lead" />
      <input type="hidden" name="subject" />
      <input type="hidden" name="source" />
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
  </body>
</html>
